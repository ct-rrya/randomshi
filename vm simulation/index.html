<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle VM VirtualBox Manager - Windows Server 2022 Simulation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Simulator Top Bar: Interactive Sandbox & Administration Controls -->
    <header class="simulator-topbar">
        <div class="sim-banner-left">
            <span class="sim-mode-badge sandbox" id="sim-mode-badge">🎮 SANDBOX MODE</span>
            <span class="sim-mode-desc" id="sim-mode-desc" style="font-size: 11px; color: #a0aec0; margin-left: 6px;">Interactive Sandbox (Free-Play)</span>
        </div>
        <div class="sim-banner-right">
            <button class="sim-control-btn" id="sim-btn-sandbox"
                title="Switch to interactive sandbox environment for free-play administration">
                🎮 Sandbox Mode
            </button>
            <button class="sim-control-btn" id="sim-btn-demo-load"
                title="Load pre-configured demonstration scenario (jdoe, GRP_Finance, C:\FinanceData)">
                ⚡ Load Demo Scenario
            </button>
            <button class="sim-control-btn" id="sim-btn-hint"
                title="View optional guidance and system hints based on current server state">
                💡 System Hint
            </button>
            <button class="sim-control-btn" id="sim-btn-reset" title="Reset simulator to clean state">
                🧹 Reset Lab
            </button>
            <button class="sim-control-btn" id="sim-btn-clear-audit"
                title="Clear simulated security and administrative audit log">
                🗑️ Clear Audit Log
            </button>
            <button class="sim-control-btn" id="sim-btn-view-audit"
                title="View Administration and Security Activity Log">
                📜 Activity Log
            </button>
            <button class="sim-control-btn" id="sim-btn-role-summary"
                title="Educational breakdown: Organizational Role vs Windows Security Group">
                🎓 Role vs Group (RBAC)
            </button>
            <button class="sim-control-btn sim-btn-accent" id="sim-btn-guide"
                title="Classroom Demonstration Reference Guide">
                📋 Reference Guide
            </button>
        </div>
    </header>

    <!-- Main Simulator Viewport -->
    <main id="app-viewport">
        <!-- ORACLE VM VIRTUALBOX MANAGER WINDOW -->
        <div class="vbox-manager-window" id="vbox-manager-window">
            <!-- Titlebar -->
            <div class="vbox-titlebar">
                <div class="vbox-title-left">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <rect width="24" height="24" rx="4" fill="#1b498b" />
                        <path d="M4 6L12 2L20 6V18L12 22L4 18V6Z" stroke="#4fc3f7" stroke-width="1.5" fill="#0d2b56" />
                        <path d="M12 2V22" stroke="#4fc3f7" stroke-width="1" />
                    </svg>
                    <span>Oracle VM VirtualBox Manager</span>
                </div>
            </div>

            <!-- Menu Bar -->
            <div class="vbox-menubar">
                <div class="vbox-menu-btn" id="vbox-menu-file">File</div>
                <div class="vbox-menu-btn" id="vbox-menu-machine">Machine</div>
                <div class="vbox-menu-btn" id="vbox-menu-help">Help</div>
            </div>

            <!-- Toolbar -->
            <div class="vbox-toolbar">
                <button class="vbox-tb-btn" id="vbox-btn-new">
                    <span class="vbox-tb-icon">✨</span>
                    <span>New</span>
                </button>
                <button class="vbox-tb-btn" id="vbox-btn-settings">
                    <span class="vbox-tb-icon">⚙️</span>
                    <span>Settings</span>
                </button>
                <div class="vbox-tb-sep"></div>
                <button class="vbox-tb-btn" id="vbox-btn-start">
                    <span class="vbox-tb-icon">▶️</span>
                    <span>Start</span>
                </button>
                <button class="vbox-tb-btn" id="vbox-btn-discard" disabled>
                    <span class="vbox-tb-icon">🗑️</span>
                    <span>Discard</span>
                </button>
                <div class="vbox-tb-sep"></div>
                <button class="vbox-tb-btn" id="vbox-btn-network">
                    <span class="vbox-tb-icon">🌐</span>
                    <span>Network</span>
                </button>
                <button class="vbox-tb-btn" id="vbox-btn-storage">
                    <span class="vbox-tb-icon">💽</span>
                    <span>Storage</span>
                </button>
            </div>

            <!-- Content Split (Left: VM List, Right: Details) -->
            <div class="vbox-content-split">
                <!-- Left Sidebar -->
                <div class="vbox-sidebar-left">
                    <div class="vbox-pane-header">
                        <span>Virtual Machines</span>
                    </div>
                    <div class="vbox-vm-list" id="vbox-vm-list">
                        <!-- Populated by virtualbox.js -->
                    </div>
                </div>

                <!-- Right Main Pane -->
                <div class="vbox-main-pane" id="vbox-main-pane">
                    <!-- Populated by virtualbox.js -->
                </div>
            </div>
        </div>

        <!-- RUNNING VM WINDOW (Distinct Guest Execution Window) -->
        <div class="vm-running-window" id="vm-running-window">
            <!-- Window Chrome Titlebar -->
            <div class="vm-win-titlebar">
                <div class="vm-win-title">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <rect x="2" y="2" width="9" height="9" fill="#0078d7" />
                        <rect x="13" y="2" width="9" height="9" fill="#0078d7" />
                        <rect x="2" y="13" width="9" height="9" fill="#0078d7" />
                        <rect x="13" y="13" width="9" height="9" fill="#0078d7" />
                    </svg>
                    <span id="vm-win-title-text">WinServer2022 [Running] - Oracle VM VirtualBox</span>
                </div>
                <div class="vm-win-controls">
                    <button class="vm-win-ctrl-btn" id="vm-win-minimize" title="Minimize">🗕</button>
                    <button class="vm-win-ctrl-btn" id="vm-win-maximize" title="Maximize">🗖</button>
                    <button class="vm-win-ctrl-btn close" id="vm-win-close" title="Close">✕</button>
                </div>
            </div>

            <!-- Window Chrome Menu Bar -->
            <div class="vm-win-menubar">
                <div class="vm-menu-item">File</div>
                <div class="vm-menu-item" id="vm-menu-machine">Machine</div>
                <div class="vm-menu-item">View</div>
                <div class="vm-menu-item" id="vm-menu-input">Input</div>
                <div class="vm-menu-item" id="vm-menu-devices">Devices</div>
                <div class="vm-menu-item">Help</div>
            </div>

            <!-- Guest OS Display Viewport -->
            <div class="vm-display-viewport" id="vm-display-viewport">
                <!-- Swapped dynamically: Boot -> Setup -> Lock Screen -> Windows Server Desktop -->
            </div>

            <!-- VirtualBox VM Status Bar -->
            <div class="vm-status-bar">
                <div class="vm-status-left">
                    <span>Host Key: <b>Right Ctrl</b></span>
                </div>
                <div class="vm-status-right">
                    <span class="vm-status-icon" title="Hard Disk Activity">💽</span>
                    <span class="vm-status-icon" title="Optical Drive Activity">💿</span>
                    <span class="vm-status-icon" title="Network Activity">🌐</span>
                    <span class="vm-status-icon" title="USB Devices">🔌</span>
                    <span class="vm-status-icon" title="Mouse Integration">🖱️</span>
                </div>
            </div>
        </div>

        <!-- Global Modal Container for Win32 & VirtualBox Dialogs -->
        <div id="modal-container"></div>
    </main>

    <!-- Scripts in Strict Dependency Order -->
    <script src="js/state.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/groups.js"></script>
    <script src="js/users.js"></script>
    <script src="js/roles.js"></script>
    <script src="js/windows.js"></script>
    <script src="js/virtualbox.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
